spring.application.name=mcp-spring
spring.datasource.url=jdbc:postgresql://localhost:5432/mcp_spring_data
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

#SPRING AI
spring.ai.google.genai.api-key=${GENAI}

spring.ai.google.genai.chat.options.model=gemini-3.5-flash-lite
spring.ai.google.genai.chat.options.temperature=0.5